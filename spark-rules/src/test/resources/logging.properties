# java.util.logging in the spark-rules test JVMs (system property java.util.logging.config.file, set in
# build.gradle.kts): the JDK's defaults, except that the ScalaTest JUnit engine logs only warnings, not its INFO lines
# on discovery and on every suite.
handlers = java.util.logging.ConsoleHandler
.level = INFO
java.util.logging.ConsoleHandler.level = INFO
java.util.logging.ConsoleHandler.formatter = java.util.logging.SimpleFormatter
org.scalatestplus.junit5.level = WARNING
