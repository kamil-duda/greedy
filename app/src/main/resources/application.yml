# Phase 2 skeleton: health only, without details, on localhost. Port 8080 stays with the legacy app until Phase 8.
spring:
  application:
    name: greedy
  # The local stack's PostgreSQL (`make db-up`); `make run` loads GREEDY_DB_PASSWORD from .env
  datasource:
    url: ${GREEDY_DB_URL:jdbc:postgresql://localhost:5432/greedy}
    username: ${GREEDY_DB_USER:greedy}
    password: ${GREEDY_DB_PASSWORD:}
  # Devtools is on bootRun's classpath (developmentOnly); restarts and its development defaults (e.g. stack traces in
  # error responses) only in profile dev
  devtools:
    restart:
      enabled: false
    add-properties: false

server:
  port: 8081
  address: 127.0.0.1

management:
  endpoints:
    web:
      exposure:
        include: health
      discovery:
        enabled: false
  endpoint:
    health:
      show-details: never
      show-components: never
      # Boot 4 turns the liveness and readiness groups on by default (/actuator/health/liveness, .../readiness)
      probes:
        enabled: false
