[versions]
kotlin = "2.3.21"
spring-boot = "4.1.2"
spark = "4.3.0"
scala = "2.13.18"
postgresql = "42.7.14"

[libraries]
spark-connect-client = { module = "org.apache.spark:spark-connect-client-jvm_2.13", version.ref = "spark" }
spark-sql-api = { module = "org.apache.spark:spark-sql-api_2.13", version.ref = "spark" }
spark-sql = { module = "org.apache.spark:spark-sql_2.13", version.ref = "spark" }
scala-library = { module = "org.scala-lang:scala-library", version.ref = "scala" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
