# Phase 1 spike stack (throwaway). Every port is published on 127.0.0.1 only.
# The host (app, tests) uses localhost ports; Spark executors use the Compose names (postgres, garage).
name: greedy-spike

x-spark: &spark
  image: apache/spark:4.3.0-scala2.13-java21-ubuntu
  networks: [spike]

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: spike
      POSTGRES_USER: spike
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    command: ["postgres", "-c", "shared_buffers=512MB", "-c", "max_wal_size=1GB", "-c", "checkpoint_timeout=15min"]
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql"]
    mem_limit: 1536m
    networks: [spike]

  garage:
    image: dxflrs/garage:v2.5.0
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
    ports: ["127.0.0.1:3900:3900"]
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    mem_limit: 512m
    networks: [spike]

  # Named volumes are created root-owned; the Spark image runs as uid 185.
  spark-volumes:
    <<: *spark
    user: root
    entrypoint: ["sh", "-c", "mkdir -p /opt/spark/events /opt/spark/ivy && chown -R 185:185 /opt/spark/events /opt/spark/ivy"]
    volumes: ["spark-events:/opt/spark/events", "spark-ivy:/opt/spark/ivy"]

  spark-master:
    <<: *spark
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master", "--host", "spark-master", "--port", "7077", "--webui-port", "8080"]
    environment: {SPARK_DAEMON_MEMORY: 256m}
    ports: ["127.0.0.1:8090:8080"]

  spark-worker:
    <<: *spark
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077", "--cores", "2", "--memory", "3g", "--webui-port", "8081"]
    environment: {SPARK_DAEMON_MEMORY: 256m}
    ports: ["127.0.0.1:8091:8081"]
    depends_on: [spark-master]

  spark-connect:
    <<: *spark
    command:
      - /opt/spark/bin/spark-submit
      - --class
      - org.apache.spark.sql.connect.service.SparkConnectServer
      - --master
      - spark://spark-master:7077
      - --conf
      - spark.driver.host=spark-connect
      - --conf
      - spark.driver.bindAddress=0.0.0.0
      - --conf
      - spark.driver.memory=1g
      - --conf
      - spark.executor.memory=2g
      - --conf
      - spark.connect.grpc.binding.port=15002
      - --conf
      - spark.scheduler.mode=FAIR
      - --conf
      - spark.eventLog.enabled=true
      - --conf
      - spark.eventLog.dir=file:///opt/spark/events
      - --conf
      - spark.jars.ivy=/opt/spark/ivy
      - --packages
      - org.postgresql:postgresql:42.7.14,org.apache.hadoop:hadoop-aws:3.5.0,software.amazon.awssdk:bundle:2.35.4
      - --conf
      - spark.hadoop.fs.s3a.endpoint=http://garage:3900
      - --conf
      - spark.hadoop.fs.s3a.endpoint.region=garage
      - --conf
      - spark.hadoop.fs.s3a.path.style.access=true
      - --conf
      - spark.hadoop.fs.s3a.connection.ssl.enabled=false
      - --conf
      - spark.hadoop.fs.s3a.access.key=${GARAGE_KEY_ID}
      - --conf
      - spark.hadoop.fs.s3a.secret.key=${GARAGE_SECRET_KEY}
      - --conf
      - spark.checkpoint.dir=s3a://checkpoints/spark
      - spark-internal
    ports: ["127.0.0.1:15002:15002", "127.0.0.1:4040:4040"]
    volumes: ["spark-events:/opt/spark/events", "spark-ivy:/opt/spark/ivy"]
    depends_on:
      spark-volumes: {condition: service_completed_successfully}
      spark-worker: {condition: service_started}

  spark-history:
    <<: *spark
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.history.HistoryServer"]
    environment:
      SPARK_DAEMON_MEMORY: 256m
      SPARK_HISTORY_OPTS: -Dspark.history.fs.logDirectory=file:///opt/spark/events
    ports: ["127.0.0.1:18080:18080"]
    volumes: ["spark-events:/opt/spark/events"]
    depends_on:
      spark-volumes: {condition: service_completed_successfully}

networks:
  spike: {}

volumes:
  pgdata: {}
  garage-meta: {}
  garage-data: {}
  spark-events: {}
  spark-ivy: {}
