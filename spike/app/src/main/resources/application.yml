server:
  port: 8081

spike:
  spark:
    connect-url: sc://localhost:15002
  db:
    app-url: jdbc:postgresql://localhost:5432/spike
    spark-url: jdbc:postgresql://postgres:5432/spike
    user: spike
    password: ${PG_PASSWORD}
  s3:
    app-endpoint: http://localhost:3900
    spark-endpoint: http://garage:3900
    bucket: uploads
    access-key: ${GARAGE_KEY_ID}
    secret-key: ${GARAGE_SECRET_KEY}
  upload:
    sink: hash
    tus-dir: ${spike.results:../results}/data/tus

spring:
  datasource:
    url: ${spike.db.app-url}
    username: ${spike.db.user}
    password: ${spike.db.password}
