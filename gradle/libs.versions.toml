# Versions as pinned in the Tech Stack of docs/plans/phase-2.md. Kotlin and JUnit are the versions Spring Boot 4.1.2
# manages; libraries without a version here get theirs from a BOM (Spring Boot in app, JUnit in test-support).
[versions]
kotlin = "2.3.21"
spring-boot = "4.1.2"
scala = "2.13.18"
spark = "4.3.0"
scalatest = "3.2.19"
scalatestplus-junit5 = "3.2.19.0"
junit = "6.0.3"
kotest = "6.2.6"
spotless = "8.11.0"
scalafmt = "3.11.5"
ktlint = "1.8.0"
scalafix-plugin = "0.3.0"
semanticdb = "4.17.4"
detekt = "1.23.8"

[libraries]
# Gradle plugins: dependencies of build-logic, so module build files apply them by id without a version
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-allopen = { module = "org.jetbrains.kotlin:kotlin-allopen", version.ref = "kotlin" }
spring-boot-gradle-plugin = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "spring-boot" }
spotless-gradle-plugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
scalafix-gradle-plugin = { module = "io.github.cosmicsilence:gradle-scalafix", version.ref = "scalafix-plugin" }
detekt-gradle-plugin = { module = "io.gitlab.arturbosch.detekt:detekt-gradle-plugin", version.ref = "detekt" }

scala-library = { module = "org.scala-lang:scala-library", version.ref = "scala" }
spark-sql-api = { module = "org.apache.spark:spark-sql-api_2.13", version.ref = "spark" }
spark-sql = { module = "org.apache.spark:spark-sql_2.13", version.ref = "spark" }
scalatest = { module = "org.scalatest:scalatest_2.13", version.ref = "scalatest" }
scalatestplus-junit5 = { module = "org.scalatestplus:junit-5-13_2.13", version.ref = "scalatestplus-junit5" }

kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-webmvc-test = { module = "org.springframework.boot:spring-boot-starter-webmvc-test" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
junit-platform-testkit = { module = "org.junit.platform:junit-platform-testkit" }
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
